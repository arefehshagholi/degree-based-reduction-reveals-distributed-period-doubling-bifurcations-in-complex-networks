name: Rebuild workbook

on:
  push:
    branches:
      - excel-build-temp
    paths:
      - '.xlsx_stage/**'
      - '.xlsx_stage-trigger'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact workbook
        shell: bash
        run: |
          cat .xlsx_stage/p00 .xlsx_stage/p01 .xlsx_stage/p02 .xlsx_stage/p03 .xlsx_stage/p04 .xlsx_stage/p05 .xlsx_stage/p06 .xlsx_stage/p07 .xlsx_stage/p08 .xlsx_stage/p09 .xlsx_stage/p10 .xlsx_stage/p11 > /tmp/workbook.b64
          base64 -d /tmp/workbook.b64 > data/manually_created_critical_points.xlsx
          test "$(stat -c%s data/manually_created_critical_points.xlsx)" = "62784"
          echo "1bad3ff62f6aa51ac453e2759bd2612d4945d45bfe60e90d9ec7258da4bc26a3  data/manually_created_critical_points.xlsx" | sha256sum -c -
          git config user.name "Arefeh Shagholi"
          git config user.email "arefeh.shagholi@gmail.com"
          git add data/manually_created_critical_points.xlsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build exact critical-point workbook"
          git push
